version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    restart: unless-stopped
    environment:
      VISIONAI_MODEL_BACKEND: ${VISIONAI_MODEL_BACKEND:-yolo}
      VISIONAI_ALLOW_FALLBACK: ${VISIONAI_ALLOW_FALLBACK:-false}
      VISIONAI_CONFIDENCE_THRESHOLD: ${VISIONAI_CONFIDENCE_THRESHOLD:-0.25}
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      # Persist the downloaded YOLO weights across container rebuilds --
      # otherwise every `docker compose build` re-downloads them.
      - visionai_model_cache:/root/.cache

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  visionai_model_cache:
